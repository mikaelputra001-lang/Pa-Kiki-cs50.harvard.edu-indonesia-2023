<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        span{
            margin-left: 5rem;

<body>
    <fieldset>

            <option value='["A","O"]'>AO</option>
            <option value='["B","B"]'>BB</option>
            <option value='["B","O"]'>BO</option>
            <option value='["A","B"]'>AB</option>
            <option value='["O","O"]'>OO</option>
        </select>
        <label id="left">Golongan darah Ibu</label>
        <select id="golDarIbu" name="golDar">
            <option value='["A","A"]'>AA</option>
            <option value='["A","O"]'>AO</option>
            <option value='["B","B"]'>BB</option>
            <option value='["B","O"]'>BO</option>
            <option value='["A","B"]'>AB</option>
            <option value='["O","O"]'>OO</option>

        <br>
        <button id="submit" onclick="goldarah_siAnak()">submit</button>
        <section id="result"></section>
